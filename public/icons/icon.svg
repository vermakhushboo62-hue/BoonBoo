<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#3a0a6b"/>
      <stop offset="0.55" stop-color="#1a0436"/>
      <stop offset="1" stop-color="#0b0217"/>
    </radialGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="0.55" stop-color="#ff1f4b"/>
      <stop offset="1" stop-color="#d4108f"/>
    </linearGradient>
    <radialGradient id="shine" cx="32%" cy="26%" r="45%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <path id="h" d="M100 182 C 42 138, 0 104, 0 58 C 0 24, 26 2, 56 2 C 76 2, 92 14, 100 32 C 108 14, 124 2, 144 2 C 174 2, 200 24, 200 58 C 200 104, 158 138, 100 182 Z"/>
    <clipPath id="left"><polygon points="-20,-20 100,-20 100,25 93,50 107,72 91,96 109,118 93,140 106,160 100,195 100,220 -20,220"/></clipPath>
    <clipPath id="right"><polygon points="220,-20 100,-20 100,25 93,50 107,72 91,96 109,118 93,140 106,160 100,195 100,220 220,220"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- psychedelic rings -->
  <g fill="none" stroke-width="14" opacity="0.8">
    <circle cx="256" cy="262" r="236" stroke="#8a2bff"/>
    <circle cx="256" cy="262" r="208" stroke="#00e5ff"/>
    <circle cx="256" cy="262" r="180" stroke="#9dff3a"/>
    <circle cx="256" cy="262" r="152" stroke="#ffe14d"/>
    <circle cx="256" cy="262" r="124" stroke="#ff7a1a"/>
    <circle cx="256" cy="262" r="96"  stroke="#ff2bd6"/>
  </g>
  <rect width="512" height="512" fill="url(#bg)" opacity="0.15"/>

  <!-- heart glow -->
  <g transform="translate(116 132) scale(1.4)" filter="url(#soft)" opacity="0.8">
    <use href="#h" fill="#ff2bd6"/>
  </g>

  <!-- the two halves, just slightly apart -->
  <g transform="translate(116 132) scale(1.4)">
    <g clip-path="url(#left)" transform="translate(-5 2) rotate(-3 60 90)">
      <use href="#h" fill="url(#heart)"/>
      <use href="#h" fill="url(#shine)"/>
    </g>
    <g clip-path="url(#right)" transform="translate(5 2) rotate(3 140 90)">
      <use href="#h" fill="url(#heart)"/>
    </g>
    <polyline points="100,30 93,50 107,72 91,96 109,118 93,140 106,160 100,178" fill="none"
      stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  </g>
</svg>
